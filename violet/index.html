имой ставке — да. Но в ней нет документов, пошлины и НДС, и нет ответственности за брак. Мы считаем обе схемы в одинаковых статьях и показываем разницу в себестоимости единицы на вашем складе. Если после честного сравнения карго выигрывает — так и скажем.`],[`Как узнать стоимость заранее?`,`Ответьте на 5 вопросов на сайте — менеджер уточнит детали, и в течение 48 часов пришлём расчёт в Telegram или WhatsApp. Бесплатно и без обязательств.`],[`Можно ли оплатить в рублях и с НДС?`,`Да, оплатить можно в рублях и с НДС. Порядок оплаты и документы для бухгалтерии согласуем при расчёте.`],[`Какие документы я получу?`,`Инвойс и упаковочный лист, экспортную декларацию, схему таможенного оформления с кодами ТН ВЭД и расчётом пошлины и НДС, декларации ТР ТС и маркировку «Честный знак», если они нужны вашей категории, и договор с приложением по ТЗ.`],[`Подойдут ли документы для маркетплейсов?`,`С 1 октября 2026 года площадки проверяют сертификаты и декларации по госреестрам. Подбираем перечень документов под вашу категорию: декларации ТР ТС, «Честный знак», требования площадок.`],[`Как вы проверяете фабрику?`,`Проверяем юридическую историю и реальные производственные мощности, сравниваем 2–5 фабрик и показываем картину по каждой. Затем утверждаем образец, фиксируем параметры в ТЗ и проверяем партию до того, как уйдут 70% оплаты.`],[`Можно ли работать с нашим поставщиком?`,`Да, можем работать с вашим поставщиком. Укажите его при расчёте — в квизе есть поле для ссылки на товар.`],[`Кто вернёт деньги за брак?`,`Определение брака, порядок доказательств, сроки ответа и лимиты компенсации закреплены в договоре. На претензии — 90 дней. Претензию с фабрикой ведём мы, на китайском. Серия проверяется до оплаты остатка, поэтому большинство проблем решается ещё в Китае.`],[`Почему аванс 30%?`,`Это стандартная схема запуска производства в Китае: 30% фабрика получает на закупку сырья, 70% — после приёмки серии. После оплаты вы получаете календарь поставки с контрольными точками.`],[`Сколько идёт поставка?`,`Срок производства и доставки называем в смете по датам. Сроки таможни и доставки по России зависят от товара.`],[`Можно ли отследить партию в пути?`,`Да. Менеджер отслеживает ваш груз и сообщает о его перемещении.`]],Ee=()=>{let[e,t]=(0,l.useState)(0);return(0,l.useEffect)(()=>{let e=document.createElement(`script`);return e.type=`application/ld+json`,e.text=JSON.stringify({"@context":`https://schema.org`,"@type":`FAQPage`,mainEntity:Te.map(([e,t])=>({"@type":`Question`,name:e,acceptedAnswer:{"@type":`Answer`,text:t}}))}),document.head.appendChild(e),()=>{document.head.removeChild(e)}},[]),(0,f.jsx)(`section`,{id:`faq`,className:`reg-paper pb-[110px]`,children:(0,f.jsxs)(`div`,{className:`max-w-[1180px] mx-auto px-6 grid grid-cols-1 md:grid-cols-12 gap-8`,children:[(0,f.jsxs)(`div`,{className:`md:col-span-4`,children:[(0,f.jsx)(`span`,{className:`label reveal`,children:`Вопросы`}),(0,f.jsx)(`h2`,{className:`display display-b text-[clamp(28px,2.9vw,40px)] mt-3 reveal`,children:(0,f.jsx)(v,{children:`Ответы на частые вопросы`})}),(0,f.jsx)(`div`,{className:`mt-6 reveal`,children:(0,f.jsx)(ne,{href:`#contacts`,children:`Задать свой вопрос`})})]}),(0,f.jsx)(`div`,{className:`md:col-span-8 grid gap-3`,children:Te.map(([n,r],i)=>(0,f.jsxs)(`div`,{className:`card card-paper reveal faq-item ${e===i?`is-open`:``}`,style:{transitionDelay:`${i*.03}s`},children:[(0,f.jsxs)(`button`,{className:`w-full text-left flex items-center justify-between gap-6 p-6`,onClick:()=>t(e===i?null:i),children:[(0,f.jsx)(`span`,{className:`display display-b text-[18px]`,children:(0,f.jsx)(v,{children:n})}),(0,f.jsx)(`span`,{className:`faq-plus`,"aria-hidden":!0})]}),(0,f.jsx)(`div`,{className:`faq-body`,children:(0,f.jsx)(`div`,{children:(0,f.jsx)(`p`,{className:`px-6 pb-6 text-[15px] text-ink-2 max-w-[68ch]`,children:(0,f.jsx)(v,{children:r})})})})]},n))})]})})},De=()=>{let[e,t]=(0,l.useState)(!1);return(0,f.jsxs)(`footer`,{id:`contacts`,className:`reg-char pt-[80px] pb-10`,style
